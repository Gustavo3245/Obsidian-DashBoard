<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradientes do cristal -->
    <linearGradient id="crystalMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"></stop>
      <stop offset="50%" stop-color="#8B5CF6"></stop>
      <stop offset="100%" stop-color="#6D28D9"></stop>
    </linearGradient>

    <linearGradient id="crystalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"></stop>
      <stop offset="100%" stop-color="#4C1D95"></stop>
    </linearGradient>

    <linearGradient id="crystalLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D5FF"></stop>
      <stop offset="100%" stop-color="#A855F7"></stop>
    </linearGradient>

    <!-- Gradiente das barras -->
    <linearGradient id="barGradient" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"></stop>
      <stop offset="100%" stop-color="#DDD6FE"></stop>
    </linearGradient>
  </defs>

  <!-- CRISTAL -->

  <!-- Silhueta principal -->
  <path d="M22 5
       L35 18
       L31 43
       L20 57
       L8 47
       L5 27
       L14 13
       Z" fill="url(#crystalMain)"></path>

  <!-- Face esquerda -->
  <path d="M22 5
       L14 13
       L5 27
       L18 23
       Z" fill="#A855F7"></path>

  <!-- Face central clara -->
  <path d="M22 5
       L18 23
       L27 30
       L35 18
       Z" fill="url(#crystalLight)"></path>

  <!-- Face inferior esquerda -->
  <path d="M5 27
       L18 23
       L17 45
       L8 47
       Z" fill="#7C3AED"></path>

  <!-- Face inferior central -->
  <path d="M18 23
       L27 30
       L31 43
       L20 57
       L17 45
       Z" fill="url(#crystalDark)"></path>

  <!-- Face direita -->
  <path d="M27 30
       L35 18
       L31 43
       Z" fill="#9333EA"></path>

  <!-- MÉTRICAS -->

  <!-- Barra 1 -->
  <rect x="38" y="39" width="6" height="16" rx="2" fill="url(#barGradient)"></rect>

  <!-- Barra 2 -->
  <rect x="47" y="29" width="6" height="26" rx="2" fill="url(#barGradient)"></rect>

  <!-- Barra 3 -->
  <rect x="56" y="17" width="6" height="38" rx="2" fill="url(#barGradient)"></rect>
</svg>